<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Novo Projeto</title><link rel="stylesheet" href="/css/style.css"></head><body><header><strong>LENVIE · Projetos</strong><nav><a href="/">Dashboard</a><a href="/projetos.html">Projetos</a></nav></header><main class="wrap"><h1>Novo Projeto</h1><form id="form" class="panel grid"><div><label>Cliente *</label><input name="cliente" required></div><div><label>Segmento</label><select name="segmento"><option>Private Label</option><option>Marca Própria</option><option>Corporativo</option><option>Outro</option></select></div><div class="full"><label>Nome do Projeto *</label><input name="nome" required></div><div><label>Responsável Interno</label><input name="responsavel" value="Erika"></div><div><label>Data de início</label><input type="date" name="data_inicio"></div><div><label>Previsão de conclusão</label><input type="date" name="previsao_conclusao"></div><div><label>Status</label><select name="status" id="status"></select></div><div><label>Etapa</label><select name="etapa_atual" id="etapa"></select></div><div><label>Aguardando / Área pendente</label><select name="area_pendente" id="area"></select></div><div><label>Data aprovação do cliente</label><input type="date" name="data_aprovacao"></div><div class="full"><label>Próxima ação</label><textarea name="proxima_acao"></textarea></div><div class="full"><label>Observações</label><textarea name="observacoes"></textarea></div><div class="full"><button class="btn">Cadastrar projeto</button></div></form></main><script src="/js/form.js"></script></body></html>
