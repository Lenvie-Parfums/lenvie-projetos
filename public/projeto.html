<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Projeto</title><link rel="stylesheet" href="/css/style.css"></head><body><header><strong>LENVIE · Projetos</strong><nav><a href="/">Dashboard</a><a href="/projetos.html">Projetos</a></nav></header><main class="wrap"><div class="page-head"><div><h1 id="titulo">Projeto</h1><div id="resumoProjeto" class="summary-line"></div></div><a class="btn secondary" href="/api/relatorios/projetos.xlsx">Exportar XLSX</a></div><form id="form" class="panel grid"><div><label>Cliente *</label><input name="cliente" required></div><div><label>Segmento</label><input name="segmento"></div><div class="full"><label>Nome do Projeto *</label><input name="nome" required></div><div><label>Origem / Indicação</label><input name="origem_cliente"></div><div><label>Comercial responsável</label><input name="comercial_responsavel"></div><div><label>Responsável pelo acompanhamento</label><input name="responsavel"></div><div><label>Previsão</label><input type="date" name="previsao_conclusao"></div><div><label>Status</label><select name="status" id="status"></select></div><div><label>Etapa atual</label><select name="etapa_atual" id="etapa"></select></div><div><label>Aguardando / Área pendente</label><select name="area_pendente" id="area"></select></div><div><label>Prazo da próxima ação</label><input type="date" name="prazo_proxima_acao"></div><div><label>Data de aprovação</label><input type="date" name="data_aprovacao"></div><div><label>Prazo 90 dias</label><input id="prazo90" disabled></div><div class="full"><label>Próxima ação</label><textarea name="proxima_acao"></textarea></div><div class="full"><label>Observações gerais</label><textarea name="observacoes"></textarea></div><div class="full"><label>Observação desta movimentação</label><textarea name="movimentacao_observacao" placeholder="Ex.: Cliente pediu nova opção de fragrância"></textarea></div><div class="full"><button class="btn">Salvar atualização</button></div></form><div class="split"><section class="panel"><h2>Tempo por etapa</h2><div id="temposEtapa"></div></section><section class="panel"><h2>Tempo aguardando</h2><div id="temposEspera"></div></section></div><h2>Histórico de Etapas</h2><div id="historico" class="panel"></div></main><script src="/js/projeto.js"></script></body></html>
