<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>Projeto | LENVIE</title>

  <link
    rel="stylesheet"
    href="/css/style.css"
  >
</head>

<body>

  <header>
    <strong>LENVIE · Projetos</strong>

    <nav>
      <a href="/">Dashboard</a>
      <a href="/projetos.html">Projetos</a>
      <a href="/novo-projeto.html">Novo Projeto</a>
    </nav>
  </header>


  <main class="wrap">

    <!-- =====================================================
         CABEÇALHO DO PROJETO
    ====================================================== -->

    <div class="page-head">

      <div>
        <h1 id="titulo">
          Projeto
        </h1>

        <div
          id="resumoProjeto"
          class="summary-line"
        ></div>
      </div>


      <a
        class="btn secondary"
        href="/api/relatorios/projetos.xlsx"
      >
        Exportar XLSX
      </a>

    </div>


    <!-- =====================================================
         FORMULÁRIO
    ====================================================== -->

    <form
      id="form"
      class="panel grid"
    >

      <!-- CLIENTE -->

      <div>
        <label>
          Cliente *
        </label>

        <input
          name="cliente"
          required
        >
      </div>


      <!-- SEGMENTO -->

      <div>
        <label>
          Segmento
        </label>

        <input
          name="segmento"
        >
      </div>


      <!-- PROJETO -->

      <div class="full">

        <label>
          Nome do Projeto *
        </label>

        <input
          name="nome"
          required
        >

      </div>


      <!-- ORIGEM -->

      <div>

        <label>
          Origem / Indicação
        </label>

        <input
          name="origem_cliente"
        >

      </div>


      <!-- COMERCIAL -->

      <div>

        <label>
          Comercial responsável
        </label>

        <input
          name="comercial_responsavel"
        >

      </div>


      <!-- RESPONSÁVEL -->

      <div>

        <label>
          Responsável pelo acompanhamento
        </label>

        <input
          name="responsavel"
        >

      </div>


      <!-- PREVISÃO -->

      <div>

        <label>
          Previsão
        </label>

        <input
          type="date"
          name="previsao_conclusao"
        >

      </div>


      <!-- STATUS -->

      <div>

        <label>
          Status
        </label>

        <select
          name="status"
          id="status"
        ></select>

      </div>


      <!-- ETAPA -->

      <div>

        <label>
          Etapa atual
        </label>

        <select
          name="etapa_atual"
          id="etapa"
        ></select>

      </div>


      <!-- ÁREA PENDENTE -->

      <div>

        <label>
          Aguardando / Área pendente
        </label>

        <select
          name="area_pendente"
          id="area"
        ></select>

      </div>


      <!-- PRAZO PRÓXIMA AÇÃO -->

      <div>

        <label>
          Prazo da próxima ação
        </label>

        <input
          type="date"
          name="prazo_proxima_acao"
        >

      </div>


      <!-- DATA APROVAÇÃO -->

      <div>

        <label>
          Data de aprovação
        </label>

        <input
          type="date"
          name="data_aprovacao"
        >

      </div>


      <!-- PRAZO 90 DIAS -->

      <div>

        <label>
          Prazo 90 dias
        </label>

        <input
          id="prazo90"
          disabled
        >

      </div>


      <!-- PRÓXIMA AÇÃO -->

      <div class="full">

        <label>
          Próxima ação
        </label>

        <textarea
          name="proxima_acao"
        ></textarea>

      </div>


      <!-- OBSERVAÇÕES -->

      <div class="full">

        <label>
          Observações gerais
        </label>

        <textarea
          name="observacoes"
        ></textarea>

      </div>


      <!-- OBSERVAÇÃO MOVIMENTAÇÃO -->

      <div class="full">

        <label>
          Observação desta movimentação
        </label>

        <textarea
          name="movimentacao_observacao"
          placeholder="Ex.: Cliente pediu nova opção de fragrância"
        ></textarea>

      </div>


      <!-- SALVAR -->

      <div class="full">

        <button
          type="submit"
          class="btn"
        >
          Salvar atualização
        </button>

      </div>

    </form>


    <!-- =====================================================
         TEMPOS AUTOMÁTICOS
    ====================================================== -->

    <div class="split">

      <section class="panel">

        <h2>
          Tempo por etapa
        </h2>

        <div
          id="temposEtapa"
        ></div>

      </section>


      <section class="panel">

        <h2>
          Tempo aguardando
        </h2>

        <div
          id="temposEspera"
        ></div>

      </section>

    </div>


    <!-- =====================================================
         HISTÓRICO
    ====================================================== -->

    <h2>
      Histórico de Etapas
    </h2>

    <div
      id="historico"
      class="panel"
    ></div>

  </main>


  <!-- IMPORTANTE:
       projeto.html contém HTML.
       projeto.js contém JavaScript.
  -->

  <script src="/js/projeto.js"></script>

</body>

</html>
